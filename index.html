<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CodBi API Documentation</title>
  <style>
    :root { --accent: #2a7b9b; --bg: #f5f7fa; --card: #fff; --shadow: 0 2px 8px rgba(0,0,0,.08); }
    @media (prefers-color-scheme: dark) { :root { --bg: #1a1a2e; --card: #16213e; --accent: #4ecdc4; } body { color: #e0e0e0; } }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); padding: 2rem; }
    .header { text-align: center; margin-bottom: 2rem; }
    .header h1 { color: var(--accent); font-size: 2rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; max-width: 1000px; margin: 0 auto; }
    .card { background: var(--card); border-radius: .75rem; padding: 1.5rem; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: .75rem; }
    .card h2 { color: var(--accent); font-size: 1.25rem; text-transform: capitalize; }
    .card a.lang { display: inline-block; padding: .4rem .8rem; border-radius: .4rem; text-decoration: none; color: inherit; border: 1px solid #ddd; font-size: .9rem; }
    .card a.lang:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="header"><h1>CodBi API Documentation</h1><p>Select a module and language.</p></div>
  <div class="grid">
    <div class="card"><h2>form</h2><a href="form/index.html" class="lang">🇬🇧 English</a><a href="form/de/index.html" class="lang">🇩🇪 German</a><a href="form/it/index.html" class="lang">🇮🇹 Italian</a></div>
    <div class="card"><h2>common</h2><a href="common/index.html" class="lang">🇬🇧 English</a><a href="common/de/index.html" class="lang">🇩🇪 German</a><a href="common/it/index.html" class="lang">🇮🇹 Italian</a></div>
    <div class="card"><h2>designer</h2><a href="designer/index.html" class="lang">🇬🇧 English</a><a href="designer/de/index.html" class="lang">🇩🇪 German</a><a href="designer/it/index.html" class="lang">🇮🇹 Italian</a></div>
    <div class="card"><h2>logic</h2><a href="logic/index.html" class="lang">🇬🇧 English</a><a href="logic/de/index.html" class="lang">🇩🇪 German</a><a href="logic/it/index.html" class="lang">🇮🇹 Italian</a></div>
  </div>
</body>
</html>
