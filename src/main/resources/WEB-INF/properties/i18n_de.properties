workflow.mirror.autoSync.tooltip = An: Die Knoten des Quell-Pfads werden in diesem Pfad automatisch erstellt/aktualisiert (beim Speichern der Quelle, bei der \u00DCbermittlung und durch die Hintergrund-Synchronisation). Aus: Der Knoten liefert nur die Struktur des Quell-Pfads als Workflow-Ergebnis und schreibt nie in diesen Pfad.
workflow.mirror.syncEndpoint = Endpunkt mit synchronisieren
workflow.mirror.syncEndpoint.tooltip = An (Standard): Der Endpunkt-Knoten des Quell-Pfads (z. B. FC_CHANGE_STATE) wird mit \u00FCbernommen \u2014 fehlt der Status im gespiegelten Projekt, wird er dort automatisch angelegt. Aus: Dieser Pfad beh\u00E4lt seinen eigenen Endpunkt, es werden nur die Aktionen davor synchronisiert.
workflow.mirror.pauseSync = Synchronisation dieses Pfads pausieren (Bremse auf der Quell-Seite)
workflow.mirror.pauseSync.tooltip = Bei einer Mirror-Node, die auf den EIGENEN Pfad zeigt: friert diesen Pfad komplett ein \u2014 es wird nichts mehr aus seinen Quellen hineingeschrieben und seine Aktionen werden in kein spiegelndes Formular mehr \u00FCbernommen (kein Push beim Speichern, keine \u00DCbermittlungs-Synchronisation, keine Hintergrund-Synchronisation). Bei jeder anderen Node stoppt sie nur diese eine Node. Zum Fortsetzen abw\u00E4hlen.
workflow.mirror.sync = Knoten jetzt erstellen
