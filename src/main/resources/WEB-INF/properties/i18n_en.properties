workflow.mirror.path = Workflow path
workflow.mirror.path.tooltip = The workflow path (trigger and node chain) that is reflected.
workflow.mirror.hint = The path is read live from the source form on every execution; changes there are visible at the next execution.
workflow.mirror.nodeCount = nodes
workflow.mirror.preview.empty = Select a form and a workflow path.
workflow.mirror.preview.form = Form
workflow.mirror.preview.path = Path
workflow.mirror.preview.placeholder = Placeholder
workflow.mirror.outputMode = Output mode
workflow.mirror.outputMode.tooltip = Controls how much of the node chain is included in the result.
workflow.mirror.outputMode.summary = Summary
workflow.mirror.outputMode.nodes = Nodes with description
workflow.mirror.autoSync = Create/update the nodes in this path
workflow.mirror.autoSync.tooltip = On: the source path's nodes are created/updated in this path automatically (on source save, on submit and by the background synchronisation). Off: the node only returns the source structure as a workflow result and never writes to this path.
workflow.mirror.syncEndpoint = Also sync the endpoint
workflow.mirror.syncEndpoint.tooltip = On (default): the source path's endpoint node (e.g. FC_CHANGE_STATE) is copied as well — a status the reflecting project does not have yet is created there automatically. Off: this path keeps its own endpoint and only the actions before it are synced.
workflow.mirror.pauseSync = Pause synchronisation of this path (source-side brake)
workflow.mirror.pauseSync.tooltip = On a Mirror node that points at its OWN path: freezes this path completely — nothing is pushed into it from its sources and its own actions are not pushed into any reflecting form (no save push, no submit re-sync, no background sync). On any other node it stops just that one node from syncing. Untick to resume.
workflow.mirror.sync = Create nodes now
workflow.mirror.sync.tooltip = Creates/updates this path's nodes from the source path immediately (no submit needed). Reload the designer afterwards to see them.
workflow.mirror.sync.running = Synchronizing...
workflow.mirror.sync.result = Sync result:
