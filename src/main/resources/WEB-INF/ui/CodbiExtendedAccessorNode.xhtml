<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:o="http://omnifaces.org/ui"
    xmlns:p="http://primefaces.org/ui"
    xmlns:xi="http://www.xima.de/taglib/xfc">

    <xi:namingContainer id="CodbiExtendedAccessorNode">

        <script>
            (function () {
                var amp = String.fromCharCode(38);
                var prefix = "#{request.contextPath}/plugin?name=Resource" + amp + "Path=";
                if (!document.querySelector("link[data-codbi-accessor-css]")) {
                    var css = document.createElement("link");
                    css.rel = "stylesheet";
                    css.setAttribute("data-codbi-accessor-css", "true");
                    css.href = prefix + "/com/github/xima_formcycle_entwicklerkreis/fc/plugin/codbi/workflow-extended-accessor.css";
                    document.head.appendChild(css);
                }
                if (!document.querySelector("script[data-codbi-accessor-js]")) {
                    var js = document.createElement("script");
                    js.setAttribute("data-codbi-accessor-js", "true");
                    js.src = prefix + "/com/github/xima_formcycle_entwicklerkreis/fc/plugin/codbi/workflow-extended-accessor.js";
                    document.head.appendChild(js);
                }
            })();
        </script>

        <xi:newWorkflowActionBase id="base" value="#{model}"
            legend="#{msg['CodbiExtendedAccessor.name']}" />

        <style>
            /* CodBi look for the Extended Accessor workflow node (darkorange accent). */
            .codbi-accessor-node .ui-selectonemenu,
            .codbi-accessor-node .p-selectonemenu {
                box-sizing: border-box !important;
                width: fit-content !important;
                min-width: 14em !important;
                max-width: 100% !important;
                height: 2.05em !important;
                min-height: 2.05em !important;
                display: inline-flex !important;
                align-items: stretch !important;
                vertical-align: middle !important;
                overflow: hidden !important;
                border: 1px solid darkorange !important;
                border-bottom-width: 1px !important;
                border-radius: 4px !important;
                background: #fff !important;
                box-shadow: 0 0.12em 0.3em rgba(255, 140, 0, 0.18) !important;
            }
            .codbi-accessor-node .ui-selectonemenu-label,
            .codbi-accessor-node .p-selectonemenu-label {
                box-sizing: border-box !important;
                display: flex !important;
                align-items: center !important;
                height: 100% !important;
                min-height: 0 !important;
                margin: 0 !important;
                padding: 0 0.5em !important;
                line-height: 1.2 !important;
                white-space: nowrap !important;
                overflow: visible !important;
                text-overflow: clip !important;
                background: transparent !important;
            }
            .codbi-accessor-node .ui-selectonemenu-trigger,
            .codbi-accessor-node .p-selectonemenu-trigger {
                box-sizing: border-box !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                width: 2.05em !important;
                height: 100% !important;
                padding: 0 !important;
                border: 0 !important;
                border-left: 1px solid darkorange !important;
                background: linear-gradient(180deg, #fff7ec 0%, #ffe3bf 100%) !important;
                color: darkorange !important;
            }
            .codbi-accessor-node .ui-selectonemenu-trigger .ui-icon-triangle-1-s {
                position: static !important;
                width: 0 !important;
                height: 0 !important;
                margin: 0 !important;
                overflow: visible !important;
                text-indent: 0 !important;
                background: none !important;
                border-left: 5px solid transparent !important;
                border-right: 5px solid transparent !important;
                border-top: 6px solid darkorange !important;
                font-size: 0 !important;
            }
            .codbi-accessor-node .p-selectonemenu-trigger .pi,
            .codbi-accessor-node .p-selectonemenu-trigger .ui-icon {
                color: darkorange !important;
            }

            .codbi-accessor-label {
                display: block;
                margin: 0.65em 0 0.2em 0;
                font-weight: 600;
            }
            .codbi-accessor-input {
                box-sizing: border-box !important;
                width: 100% !important;
                height: 2.05em !important;
                padding: 0 0.5em !important;
                border: 1px solid #cbd5e1 !important;
                border-left: 3px solid darkorange !important;
                border-radius: 4px !important;
                background: #fff !important;
                color: inherit !important;
            }
            .codbi-accessor-input:focus {
                outline: none !important;
                border-color: darkorange !important;
                border-left-color: darkorange !important;
                box-shadow: 0 0 0 2px rgba(255, 140, 0, 0.2) !important;
            }
            .codbi-accessor-node .codbi-accessor-element-select {
                width: 100% !important;
                min-width: 0 !important;
            }
            .codbi-accessor-hint {
                display: block;
                margin-top: 0.2em;
                color: #6b7280;
                font-size: 0.9em;
            }

            .codbi-accessor-preview {
                margin-top: 0.9em;
                padding: 0.75em 0.9em;
                border: 1px solid darkorange;
                border-left: 4px solid darkorange;
                border-radius: 6px;
                background: linear-gradient(135deg, #fffdf9 0%, #fff3e6 100%);
                box-shadow: 0 0 0.4em rgba(255, 140, 0, 0.18);
            }
            .codbi-accessor-preview__title {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 0.5em;
                margin-bottom: 0.5em;
                font-weight: 700;
                color: #a85a00;
            }
            .codbi-accessor-copy {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                box-sizing: border-box;
                width: 1.9em;
                height: 1.9em;
                padding: 0;
                border: 1px solid darkorange;
                border-radius: 4px;
                background: #fff;
                color: darkorange;
                cursor: pointer;
                transform: translateY(0) scale(1);
                transition:
                    background 0.15s ease,
                    color 0.15s ease,
                    box-shadow 0.15s ease,
                    transform 0.15s ease;
                will-change: transform;
            }
            .codbi-accessor-copy:hover,
            .codbi-accessor-copy:focus-visible {
                background: darkorange;
                color: #fff;
                outline: none;
                transform: translateY(-1px) scale(1.08);
                box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.25);
            }
            .codbi-accessor-copy:hover .fa,
            .codbi-accessor-copy:focus-visible .fa {
                animation: codbi-accessor-copy-wiggle 0.5s ease;
            }
            .codbi-accessor-copy:active {
                transform: translateY(0) scale(0.9);
                box-shadow:
                    inset 0 0 0.35em rgba(255, 255, 255, 0.55),
                    0 0 0 2px rgba(255, 140, 0, 0.35);
            }
            .codbi-accessor-copy--copied {
                background: darkorange;
                color: #fff;
                animation: codbi-accessor-copy-pop 0.35s ease;
            }
            @keyframes codbi-accessor-copy-wiggle {
                0% { transform: rotate(0deg); }
                30% { transform: rotate(-14deg); }
                60% { transform: rotate(10deg); }
                100% { transform: rotate(0deg); }
            }
            @keyframes codbi-accessor-copy-pop {
                0% { transform: scale(1); }
                45% { transform: scale(1.18); }
                100% { transform: scale(1); }
            }
            .codbi-accessor-preview__row {
                display: flex;
                align-items: baseline;
                gap: 0.5em;
                margin: 0.25em 0;
            }
            .codbi-accessor-preview__label {
                flex: 0 0 7.5em;
                color: #8a4700;
                font-weight: 600;
            }
            .codbi-accessor-preview__value {
                flex: 1 1 auto;
                min-width: 0;
                padding: 0.1em 0.4em;
                border: 1px solid #ffd8a8;
                border-radius: 4px;
                background: #fff;
                color: #3a2200;
                font-family: monospace;
                word-break: break-word;
            }
            .codbi-accessor-preview__empty {
                color: #9a7b55;
                font-style: italic;
            }

            .codbi-accessor-checks {
                display: flex;
                flex-direction: column;
                gap: 0.4em;
                margin: 0 0 0.9em 0;
            }
            .codbi-accessor-check {
                display: flex;
                align-items: center;
                gap: 0.55em;
                margin: 0;
                cursor: pointer;
            }
            .codbi-accessor-check > .ui-chkbox,
            .codbi-accessor-check > .p-checkbox {
                flex: 0 0 auto;
            }
            .codbi-accessor-check label {
                display: inline-flex !important;
                align-items: center !important;
                flex: 1 1 auto;
                margin: 0 !important;
                line-height: 1.35 !important;
                cursor: pointer;
            }
            .codbi-accessor-check .ui-chkbox-box,
            .codbi-accessor-check .p-checkbox-box {
                appearance: none !important;
                -webkit-appearance: none !important;
                position: relative !important;
                box-sizing: border-box !important;
                width: 16px !important;
                height: 16px !important;
                min-width: 16px !important;
                min-height: 16px !important;
                margin: 0 !important;
                border: 2px solid darkorange !important;
                border-radius: 4px !important;
                background: rgba(255, 255, 255, 0.55) !important;
                cursor: pointer !important;
                transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease !important;
            }
            .codbi-accessor-check .ui-chkbox-box:hover,
            .codbi-accessor-check .p-checkbox-box:hover {
                box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.25) !important;
            }
            .codbi-accessor-check .ui-chkbox-box.ui-state-active,
            .codbi-accessor-check .p-checkbox-box.p-highlight {
                background-color: darkorange !important;
                border-color: darkorange !important;
            }
            .codbi-accessor-check .ui-chkbox-icon,
            .codbi-accessor-check .p-checkbox-icon {
                display: none !important;
            }
            .codbi-accessor-check .ui-chkbox-box.ui-state-active::after,
            .codbi-accessor-check .p-checkbox-box.p-highlight::after {
                content: "";
                position: absolute;
                left: 4px;
                top: 1px;
                width: 4px;
                height: 8px;
                border: solid #fff;
                border-width: 0 2px 2px 0;
                transform: rotate(45deg);
            }
            .codbi-accessor-check input[type="checkbox"] {
                width: 16px;
                height: 16px;
                accent-color: darkorange;
                cursor: pointer;
            }
        </style>

        <div class="codbi-accessor-node">

            <p:fieldset id="sourceSection"
                legend="#{msg['workflow.extended_accessor.section_source']}"
                styleClass="fc-fieldset">

                <p:outputLabel for="codbiAccessorFieldName"
                    styleClass="codbi-accessor-label"
                    title="#{msg['workflow.extended_accessor.field.tooltip']}"
                    value="#{msg['workflow.extended_accessor.field']}" />
                <div id="codbiAccessorTree" class="codbi-accessor-tree"
                    data-codbi-accessor-tree="true"
                    data-context-path="#{request.contextPath}"
                    data-project-id="#{workflowProviderBean.project.id}"
                    data-input-id="#{codbiAccessorFieldName.clientId}"
                    data-input-class="codbi-accessor-field-name"
                    data-value="#{model.fieldName}"
                    data-filter-placeholder="#{msg['workflow.extended_accessor.tree.filter']}"
                    data-loading="#{msg['workflow.extended_accessor.tree.loading']}"
                    data-no-results="#{msg['workflow.extended_accessor.tree.noResults']}"
                    data-no-form="#{msg['workflow.extended_accessor.tree.noForm']}"
                    title="#{msg['workflow.extended_accessor.tree.tooltip']}">
                </div>
                <!--
                    Hidden but fully rendered text input. The tree writes the selected technical element name
                    into it and invokes the remote command below, which explicitly processes THIS input by its
                    absolute client id. This avoids relying on relative search expressions and also keeps the
                    value part of every normal property-form submit.
                -->
                <p:inputText id="codbiAccessorFieldName" value="#{model.fieldName}"
                    style="display:none !important"
                    styleClass="codbi-accessor-field-name" />
                <p:remoteCommand name="codbiAccessorSelectField"
                    process="@this codbiAccessorFieldName"
                    actionListener="#{elementPropertiesBean.storeCurrent}"
                    update=":flowchartForm:flowchart elementPreview" />
                <h:outputText styleClass="codbi-accessor-hint"
                    value="#{msg['workflow.extended_accessor.field.hint']}" />

                <p:outputPanel id="elementPreview" layout="block"
                    styleClass="codbi-accessor-preview">
                    <div class="codbi-accessor-preview__title">
                        <h:outputText
                            value="#{msg['workflow.extended_accessor.preview.title']}" />
                        <button type="button" class="codbi-accessor-copy"
                            data-codbi-accessor-copy="true"
                            data-title="#{msg['workflow.extended_accessor.preview.copy']}"
                            data-copied="#{msg['workflow.extended_accessor.preview.copied']}"
                            title="#{msg['workflow.extended_accessor.preview.copy']}"
                            aria-label="#{msg['workflow.extended_accessor.preview.copy']}">
                            <i class="fa fa-clipboard" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div class="codbi-accessor-preview__row">
                        <span class="codbi-accessor-preview__label">
                            <h:outputText
                                value="#{msg['workflow.extended_accessor.preview.element']}" />
                        </span>
                        <code class="codbi-accessor-preview__value">#{empty model.fieldName ? '&#8212;' : model.fieldName}</code>
                    </div>
                    <div class="codbi-accessor-preview__row">
                        <span class="codbi-accessor-preview__label">
                            <h:outputText
                                value="#{msg['workflow.extended_accessor.preview.placeholder']}" />
                        </span>
                        <code class="codbi-accessor-preview__value"
                            data-codbi-accessor-placeholder="true"
                            data-node-name="#{model.name}">[%#{model.name}.RESULT.value%]</code>
                    </div>
                </p:outputPanel>

                <p:outputLabel for="repetitionMode"
                    styleClass="codbi-accessor-label"
                    title="#{msg['workflow.extended_accessor.repetitionMode.tooltip']}"
                    value="#{msg['workflow.extended_accessor.repetitionMode']}" />
                <p:selectOneMenu id="repetitionMode" value="#{model.repetitionMode}"
                    title="#{msg['workflow.extended_accessor.repetitionMode.tooltip']}">
                    <f:selectItem itemValue="CURRENT"
                        itemLabel="#{msg['workflow.extended_accessor.repetitionMode.current']}" />
                    <f:selectItem itemValue="INDEX"
                        itemLabel="#{msg['workflow.extended_accessor.repetitionMode.index']}" />
                    <f:selectItem itemValue="ALL"
                        itemLabel="#{msg['workflow.extended_accessor.repetitionMode.all']}" />
                    <p:ajax event="change" partialSubmit="true"
                        listener="#{elementPropertiesBean.storeCurrent}" process="@this"
                        update=":flowchartForm:flowchart" global="false" />
                </p:selectOneMenu>

                <p:outputLabel for="repetitionIndex"
                    styleClass="codbi-accessor-label"
                    title="#{msg['workflow.extended_accessor.repetitionIndex.tooltip']}"
                    value="#{msg['workflow.extended_accessor.repetitionIndex']}" />
                <p:inputText id="repetitionIndex" value="#{model.repetitionIndex}"
                    styleClass="codbi-accessor-input"
                    title="#{msg['workflow.extended_accessor.repetitionIndex.tooltip']}">
                    <p:ajax event="change" partialSubmit="true"
                        listener="#{elementPropertiesBean.storeCurrent}" process="@this"
                        update=":flowchartForm:flowchart" global="false" />
                </p:inputText>

                <p:outputLabel for="joinSeparator"
                    styleClass="codbi-accessor-label"
                    title="#{msg['workflow.extended_accessor.joinSeparator.tooltip']}"
                    value="#{msg['workflow.extended_accessor.joinSeparator']}" />
                <p:inputText id="joinSeparator" value="#{model.joinSeparator}"
                    styleClass="codbi-accessor-input"
                    title="#{msg['workflow.extended_accessor.joinSeparator.tooltip']}">
                    <p:ajax event="change" partialSubmit="true"
                        listener="#{elementPropertiesBean.storeCurrent}" process="@this"
                        update=":flowchartForm:flowchart" global="false" />
                </p:inputText>

            </p:fieldset>

            <p:fieldset legend="#{msg['workflow.extended_accessor.section_options']}"
                styleClass="fc-fieldset">

                <div class="codbi-accessor-checks">

                    <div class="codbi-accessor-check">
                        <p:selectBooleanCheckbox id="includeMeta"
                            value="#{model.includeMeta}"
                            title="#{msg['workflow.extended_accessor.includeMeta.tooltip']}">
                            <p:ajax event="change" partialSubmit="true"
                                listener="#{elementPropertiesBean.storeCurrent}" process="@this"
                                update=":flowchartForm:flowchart" global="false" />
                        </p:selectBooleanCheckbox>
                        <p:outputLabel for="includeMeta"
                            title="#{msg['workflow.extended_accessor.includeMeta.tooltip']}"
                            value="#{msg['workflow.extended_accessor.includeMeta']}" />
                    </div>

                    <div class="codbi-accessor-check">
                        <p:selectBooleanCheckbox id="sanitizeHtml"
                            value="#{model.sanitizeHtml}"
                            title="#{msg['workflow.extended_accessor.sanitizeHtml.tooltip']}">
                            <p:ajax event="change" partialSubmit="true"
                                listener="#{elementPropertiesBean.storeCurrent}" process="@this"
                                update=":flowchartForm:flowchart" global="false" />
                        </p:selectBooleanCheckbox>
                        <p:outputLabel for="sanitizeHtml"
                            title="#{msg['workflow.extended_accessor.sanitizeHtml.tooltip']}"
                            value="#{msg['workflow.extended_accessor.sanitizeHtml']}" />
                    </div>

                    <div class="codbi-accessor-check">
                        <p:selectBooleanCheckbox id="allowImages"
                            value="#{model.allowImages}"
                            title="#{msg['workflow.extended_accessor.allowImages.tooltip']}">
                            <p:ajax event="change" partialSubmit="true"
                                listener="#{elementPropertiesBean.storeCurrent}" process="@this"
                                update=":flowchartForm:flowchart" global="false" />
                        </p:selectBooleanCheckbox>
                        <p:outputLabel for="allowImages"
                            title="#{msg['workflow.extended_accessor.allowImages.tooltip']}"
                            value="#{msg['workflow.extended_accessor.allowImages']}" />
                    </div>

                    <div class="codbi-accessor-check">
                        <p:selectBooleanCheckbox id="allowLinks"
                            value="#{model.allowLinks}"
                            title="#{msg['workflow.extended_accessor.allowLinks.tooltip']}">
                            <p:ajax event="change" partialSubmit="true"
                                listener="#{elementPropertiesBean.storeCurrent}" process="@this"
                                update=":flowchartForm:flowchart" global="false" />
                        </p:selectBooleanCheckbox>
                        <p:outputLabel for="allowLinks"
                            title="#{msg['workflow.extended_accessor.allowLinks.tooltip']}"
                            value="#{msg['workflow.extended_accessor.allowLinks']}" />
                    </div>

                    <div class="codbi-accessor-check">
                        <p:selectBooleanCheckbox id="allowTables"
                            value="#{model.allowTables}"
                            title="#{msg['workflow.extended_accessor.allowTables.tooltip']}">
                            <p:ajax event="change" partialSubmit="true"
                                listener="#{elementPropertiesBean.storeCurrent}" process="@this"
                                update=":flowchartForm:flowchart" global="false" />
                        </p:selectBooleanCheckbox>
                        <p:outputLabel for="allowTables"
                            title="#{msg['workflow.extended_accessor.allowTables.tooltip']}"
                            value="#{msg['workflow.extended_accessor.allowTables']}" />
                    </div>

                    <div class="codbi-accessor-check">
                        <p:selectBooleanCheckbox id="allowStyles"
                            value="#{model.allowStyles}"
                            title="#{msg['workflow.extended_accessor.allowStyles.tooltip']}">
                            <p:ajax event="change" partialSubmit="true"
                                listener="#{elementPropertiesBean.storeCurrent}" process="@this"
                                update=":flowchartForm:flowchart" global="false" />
                        </p:selectBooleanCheckbox>
                        <p:outputLabel for="allowStyles"
                            title="#{msg['workflow.extended_accessor.allowStyles.tooltip']}"
                            value="#{msg['workflow.extended_accessor.allowStyles']}" />
                    </div>

                    <div class="codbi-accessor-check">
                        <p:selectBooleanCheckbox id="htmlToText"
                            value="#{model.htmlToText}"
                            title="#{msg['workflow.extended_accessor.htmlToText.tooltip']}">
                            <p:ajax event="change" partialSubmit="true"
                                listener="#{elementPropertiesBean.storeCurrent}" process="@this"
                                update=":flowchartForm:flowchart" global="false" />
                        </p:selectBooleanCheckbox>
                        <p:outputLabel for="htmlToText"
                            title="#{msg['workflow.extended_accessor.htmlToText.tooltip']}"
                            value="#{msg['workflow.extended_accessor.htmlToText']}" />
                    </div>

                </div>


            </p:fieldset>

        </div>

    </xi:namingContainer>

</ui:composition>
