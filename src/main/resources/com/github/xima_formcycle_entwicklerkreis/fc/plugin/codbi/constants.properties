# === TinyMCE Auto-Update ===
# Controls automatic checking and updating of the bundled TinyMCE editor.
#
# TinyMCE_AutoUpdate:
#   false                     - Disabled (default).
#   true                      - Check on restart, auto-download & update.
#   notify                    - Check on restart, log new version, do NOT update.
#   notify_mail=addr@...      - Check, log, and send notification email.
#
# TinyMCE_Update_VersionURL:
#   URL returning JSON with a "version" field.
#   Default: https://registry.npmjs.org/tinymce/latest
#
# TinyMCE_Update_DownloadBaseURL:
#   Base URL for downloading TinyMCE distribution files.
#   Use {version} as placeholder for the target version.
#   Default: https://cdn.jsdelivr.net/npm/tinymce@{version}
#
# TinyMCE_Update_ExternalDir:
#   Directory where updated TinyMCE files are stored.
#   The Resource servlet checks this directory before the classpath.
#   Default: ${user.home}/.codbi/tinymce