# Fallback base URL of the published CodBi documentation. The help icons of the CodBi form panel and
# the Mirror widget first honour the per-language documentation redirect configured via the plugin
# properties `Docs_Frontend_<lang>` (published as `window.CodbiPluginData.docsAPI`) and otherwise
# fall back to the matching language section of the `form` module of these docs, e.g.
# `<base>form/de/` — resolved at runtime from the current designer language (see
# `packages/designer/src/js/CodbiDocs.ts`; English is the module root `<base>form/`).
docs.base_url                      = https://xima-formcycle-entwicklerkreis.github.io/CodBi/

designer.property.enable_codbi              = codbi-prop-enable
designer.property.enable_codbi.default      = 0
designer.property.config_template           = codbi-prop-config-template
designer.property.config_template.default   = default
designer.property.standards                 = codbi-prop-standards
designer.property.standards.default         = Holistic.CSS.Standard
# "Mark CodBi elements in the designer" mode: paints CodBi overlays (e.g. the Mirror
# badge) onto the design canvas. Toggled globally with ALT+V.
designer.property.mark_elements             = codbi-prop-mark-elements
designer.property.mark_elements.default     = 0
# Companion mode: expands every marker so its full text is shown without hovering.
# The switch sits right next to the "mark elements" switch.
designer.property.mark_labels               = codbi-prop-mark-labels
designer.property.mark_labels.default       = 0

apiDoc.dialog.input.label.prefix = codbi-prop-apiDoc-dialog-input-label-prefix

# === TinyMCE Auto-Update ===
# Controls automatic checking and updating of the bundled TinyMCE editor.
#
# TinyMCE_AutoUpdate:
#   false                     - Disabled (default).
#   true                      - Check on restart, auto-download & update.
#   notify                    - Check on restart, log new version, do NOT update.
#   notify_mail=addr@...      - Check, log, and send notification email.
#
# TinyMCE_Update_VersionURL:
#   URL returning JSON with a "version" field.
#   Default: https://registry.npmjs.org/tinymce/latest
#
# TinyMCE_Update_DownloadBaseURL:
#   Base URL for downloading TinyMCE distribution files.
#   Use {version} as placeholder for the target version.
#   Default: https://cdn.jsdelivr.net/npm/tinymce@{version}
#
# TinyMCE_Update_ExternalDir:
#   Directory where updated TinyMCE files are stored.
#   The Resource servlet checks this directory before the classpath.
#   Default: ${user.home}/.codbi/tinymce

# === Mirror widget (references/mirrors a form element from another form) ===
# Technical name prefix of the Mirror widget (must be unique across all widgets).
mirror.prefix = mir
# The referenced source form, stored as a "project-<id>" key.
mirror.property.form = codbi_mirror_form
# Cached display title of the referenced source form (designer display only).
mirror.property.form_name = codbi_mirror_form_name
# The referenced source element, stored as the element's id (falls back to its name).
mirror.property.element = codbi_mirror_element
# Cached display label of the referenced source element (designer display only).
mirror.property.element_name = codbi_mirror_element_name
# Servlet action NAME (the `name=` parameter of the plugin endpoint) used by the designer
# dropdowns and by the assistant to read another form's elements.
mirror.servlet_action.name = CodBi_Mirror
# CSS class applied to the rendered Mirror wrapper.
mirror.css_class = codbi-mirror

# Mirror widget / catalogue plugin identifiers.
plugin.form_element_widget.id = com.github.xima_formcycle_entwicklerkreis.fc.plugin.codbi.CodbiFormElementWidget
plugin.form_element_catalogue.id = com.github.xima_formcycle_entwicklerkreis.fc.plugin.codbi.CodbiFormElementCatalogue

# === Functionality widget (wraps exactly one form element and applies CodBi functionalities to it) ===
# Technical name prefix of the Functionality widget (must be unique across all widgets).
functionality.prefix = fnc
# The comma-separated list of CodBi functionality ids applied to the contained element.
functionality.property.funcs = codbi_func_funcs
# Cached display names of the chosen functionalities (designer display only).
functionality.property.funcs_name = codbi_func_funcs_name
# The contained (referenced) form element, stored as the element's id (falls back to its name).
functionality.property.element = codbi_func_element
# Cached display label of the contained element (designer display only).
functionality.property.element_name = codbi_func_element_name
# Whether the widget previews the contained element with the CodBi functionalities applied (1/0).
functionality.property.preview = codbi_func_preview
# CSS class applied to the rendered Functionality wrapper.
functionality.css_class = codbi-functionality