# === TinyMCE Auto-Update ===
# Controls automatic checking and updating of the bundled TinyMCE editor.
#
# TinyMCE_AutoUpdate:
#   false                     - Disabled (default).
#   true                      - Check on restart, auto-download & update.
#   notify                    - Check on restart, log new version, do NOT update.
#   notify_mail=addr@...      - Check, log, and send notification email.
#
# TinyMCE_Update_VersionURL:
#   URL returning JSON with a "version" field.
#   Default: https://registry.npmjs.org/tinymce/latest
#
# TinyMCE_Update_DownloadBaseURL:
#   Base URL for downloading TinyMCE distribution files.
#   Use {version} as placeholder for the target version.
#   Default: https://cdn.jsdelivr.net/npm/tinymce@{version}
#
# TinyMCE_Update_ExternalDir:
#   Directory where updated TinyMCE files are stored.
#   The Resource servlet checks this directory before the classpath.
#   Default: ${user.home}/.codbi/tinymce

# === Mirror widget (references/mirrors a form element from another form) ===
# Technical name prefix of the Mirror widget (must be unique across all widgets).
mirror.prefix = mir
# The referenced source form, stored as a "project-<id>" key.
mirror.property.form = codbi_mirror_form
# Cached display title of the referenced source form (designer display only).
mirror.property.form_name = codbi_mirror_form_name
# The referenced source element, stored as the element's id (falls back to its name).
mirror.property.element = codbi_mirror_element
# Cached display label of the referenced source element (designer display only).
mirror.property.element_name = codbi_mirror_element_name
# Servlet action NAME (the `name=` parameter of the plugin endpoint) used by the designer
# dropdowns and by the assistant to read another form's elements.
mirror.servlet_action.name = CodBi_Mirror
# CSS class applied to the rendered Mirror wrapper.
mirror.css_class = codbi-mirror

# Mirror widget / catalogue plugin identifiers.
