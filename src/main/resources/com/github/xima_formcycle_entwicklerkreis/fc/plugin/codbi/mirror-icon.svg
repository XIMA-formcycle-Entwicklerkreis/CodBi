<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  CodBi Mirror widget icon.

  A perspective mirror frame (its left side nearer to the observer) pierced by a technical,
  two-headed beam arrow, flanked by the two CodBi brackets. The arrow is a soft, out-of-focus
  "beam" stroke (light blue, lower opacity) with a crisp two-rail arrow and stealth chevrons on
  top — a glowing, blurred look rather than a plain line.

  Kept in sync with `XMirror.ICON_SVG` (Kotlin) and the badge icon in
  `packages/designer/src/js/CodbiElementMarkers.ts`.
-->

