checksumBehavior: update

enableGlobalCache: true

logFilters:
  - code: YN0060
    pattern: "typedoc*"
    level: discard
  - code: YN0086
    level: discard

nodeLinker: node-modules

packageExtensions:
  "@typhonjs-typedoc/typedoc-theme-dmt@*":
    peerDependenciesMeta:
      typedoc:
        optional: true
  "@tinymce/tinymce-angular@*":
    peerDependenciesMeta:
      "@angular/common":
        optional: true
      "@angular/core":
        optional: true
      "@angular/forms":
        optional: true
  "@ngneat/transloco@*":
    peerDependenciesMeta:
      "@angular/core":
        optional: true
      rxjs:
        optional: true

npmScopes:
  de-xima:
    npmAlwaysAuth: true
    npmRegistryServer: "https://artifactory.xima-services.de/artifactory/api/npm/fc-plugin-dev-npm"

pnpEnableInlining: false

yarnPath: .yarn/releases/yarn-4.6.0.cjs
