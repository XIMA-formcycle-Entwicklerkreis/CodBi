<div id = 'CodBi_LocalAPIDoc' #CodBi_LocalAPIDoc >
    <p-splitter id = "Splitter"
                [panelSizes]    = "[25, 75]"
                [minSizes]      = "[20, 50]"
                [style]         = "{ height: '100%', width : '100%' }">
        <ng-template #panel >
            <div class = "-panel -left">
                <p-tree #CodBi_LocalAPIDoc_Tree

                        [value]         = "activeTab === 'Functionality' ? items : activeTab === 'Elementplaceholder' ? itemsElementplaceholder : itemsStandard"
                        [filter]        = "true"
                        [(selection)]   = currentlySelectedTreeNode

                        selectionMode       = "single"
                        filterPlaceholder   ="Suche"

                        (onNodeSelect) = "onNodeSelect( $event )">
                        <ng-template let-node pTemplate = "default">
                            <div style = "display : flex ;">
                                <p>{{ node.label }}</p>

                                <button class = "--CB-LocalAPIDoc-RemoveTreeItem"

                                        (click) = "onDeleteNode( $event )"></button></div></ng-template></p-tree>

                <button class = "-add" #CodBi_LocalAPIDoc_Add>+</button></div></ng-template>

        <ng-template id = "CodBi_LocalAPIDoc_RightPanel" #panel >
            <p-tabs [(value)] = "activeTab" [lazy]="false">
                <p-tablist>
                    <p-tab value    = "Functionality">Funktionalitäten</p-tab>
                    <p-tab value    = "Elementplaceholder">Elementplatzhalter</p-tab>
                    <p-tab value    = "Standard">Standard Konfigurationen</p-tab>

                    <div id = "CodBi_LocalAPIDoc_RightPanel_Options">
                        <button id = "CodBi_LocalAPIDoc_RightPanel_Options_Sync"

                                (click) = "enSync()"></button></div></p-tablist>

                <p-tabpanels>
                    <p-tabpanel value="Functionality">
                        <p-accordion    [(value)]   = "activeAccordion"
                                        [multiple]  = "true">
                            <p-accordion-panel value = "Description">
                                <p-accordion-header>Beschreibung</p-accordion-header>

                                <p-accordion-content #CodBi_LocalAPIDoc_Functionalities_Description >
                                    <div>
                                        <editor *ngIf="activeTab === 'Functionality'"

                                                id = "editorDescription_Functionalities" #editorDescription_Functionalities

                                                licenseKey      = "gpl"

                                                (onInit)        = "onInitTinyMCE_Description( $event )"
                                                [(ngModel)]     = "description"
                                                [initialValue]  = "'<p>Hier die Beschreibung der Funktionalität eingeben...</p>'"
                                                [init]="{
                                                    plugins                     :   'advlist autolink lists link image table code help wordcount ' +
                                                                                    'charmap preview anchor searchreplace visualblocks fullscreen ' +
                                                                                    'insertdatetime media emoticons autosave quickbars visualchars ',
                                                    selector                    :   'textarea',
                                                    onboarding                  :   false,
                                                    toolbar                     :   'undo redo searchreplace | blocks | ' +
                                                                                    'bold italic forecolor | alignleft aligncenter ' +
                                                                                    'alignright alignjustify | bullist numlist outdent indent | ' +
                                                                                    'removeformat | media insertdatetime charmap emoticons anchor | ' +
                                                                                    'preview fullscreen visualchars | help',
                                                    quickbars_selection_toolbar : 'bold italic underline | quicklink',
                                                    quickbars_image_toolbar     : 'alignleft aligncenter alignright | imageoptions',
                                                    quickbars_insert_toolbar    : 'quicktable quickimage quickform',
                                                    height                      :   300,
                                                    base_url                    :   resourceurl,
                                                    suffix                      :   '.min'}"></editor></div></p-accordion-content></p-accordion-panel>

                            <p-accordion-panel value = "Parameter">
                                <p-accordion-header>Parameter</p-accordion-header>

                                <p-accordion-content>
                                    <ng-container   [ngTemplateOutlet]          = "tplParameter"
                                                    [ngTemplateOutletContext]   = "{ data: currentlySelectedFunctionalityData ? currentlySelectedFunctionalityData.Parameter ? currentlySelectedFunctionalityData.Parameter : [] : []}"></ng-container></p-accordion-content></p-accordion-panel>

                            <p-accordion-panel value = "Notes">
                                <p-accordion-header>Notizen</p-accordion-header>

                                <p-accordion-content>
                                    <textarea   id = "CodBi_LocalAPIDoc_RightPanel_Notes_Text"

                                                [(ngModel)] = "notes"

                                                placeholder = "Hier können Notizen erfasst werden die ausschließlich über dieses Interface zugänglich sind..."></textarea></p-accordion-content></p-accordion-panel></p-accordion></p-tabpanel>

                    <p-tabpanel value="Elementplaceholder">
                        <p-accordion    [(value)]   = "activeAccordion"
                                        [multiple]  = "true">
                            <p-accordion-panel value = "Description">
                                <p-accordion-header>Beschreibung</p-accordion-header>

                                <p-accordion-content #CodBi_LocalAPIDoc_Elementplaceholder_Description >
                                    <div>
                                        <editor *ngIf="activeTab === 'Elementplaceholder'"

                                                id = "editorDescription_Elementplaceholder" #editorDescription_Elementplaceholder

                                                licenseKey      = "gpl"

                                                (onInit)        = "onInitTinyMCE_Description( $event )"
                                                [(ngModel)]     = "description"
                                                [initialValue]  = "'<p>Hier die Beschreibung des Elementplatzhalters eingeben...</p>'"
                                                [init]="{
                                                    plugins                     :   'advlist autolink lists link image table code help wordcount ' +
                                                                                    'charmap preview anchor searchreplace visualblocks fullscreen ' +
                                                                                    'insertdatetime media emoticons autosave quickbars visualchars ',
                                                    selector                    :   'textarea',
                                                    onboarding                  :   false,
                                                    toolbar                     :   'undo redo searchreplace | blocks | ' +
                                                                                    'bold italic forecolor | alignleft aligncenter ' +
                                                                                    'alignright alignjustify | bullist numlist outdent indent | ' +
                                                                                    'removeformat | media insertdatetime charmap emoticons anchor | ' +
                                                                                    'preview fullscreen visualchars | help',
                                                    quickbars_selection_toolbar : 'bold italic underline | quicklink',
                                                    quickbars_image_toolbar     : 'alignleft aligncenter alignright | imageoptions',
                                                    quickbars_insert_toolbar    : 'quicktable quickimage quickform',
                                                    height                      :   300,
                                                    base_url                    :   resourceurl,
                                                    suffix                      :   '.min'}"></editor></div></p-accordion-content></p-accordion-panel>

                            <p-accordion-panel value="Parameter">
                                <p-accordion-header>Parameter</p-accordion-header>
                                <p-accordion-content>
                                    <ng-container   [ngTemplateOutlet]          = "tplParameter"
                                                    [ngTemplateOutletContext]   = "{ data: currentlySelectedFunctionalityData ? currentlySelectedFunctionalityData.Parameter ? currentlySelectedFunctionalityData.Parameter : [] : []}"></ng-container></p-accordion-content></p-accordion-panel>

                            <p-accordion-panel value="Notes">
                                <p-accordion-header>Notizen</p-accordion-header>

                                <p-accordion-content>
                                    <textarea   id = "CodBi_LocalAPIDoc_RightPanel_Notes_Text"

                                                [(ngModel)] = "notes"

                                                placeholder = "Hier können Notizen erfasst werden die ausschließlich über dieses Interface zugänglich sind..."></textarea></p-accordion-content></p-accordion-panel></p-accordion></p-tabpanel>

                    <p-tabpanel value="Standard">
                        <p-accordion    [(value)]   = "activeAccordion"
                                        [multiple]  = "true">
                            <p-accordion-panel value = "Description">
                                <p-accordion-header>Beschreibung</p-accordion-header>

                                <p-accordion-content #CodBi_LocalAPIDoc_Elementplaceholder_Description >
                                    <div>
                                        <editor *ngIf="activeTab === 'Standard'"

                                                id = "editorDescription_Standard" #editorDescription_Standard

                                                licenseKey      = "gpl"

                                                (onInit)        = "onInitTinyMCE_Description( $event )"
                                                [(ngModel)]     = "description"
                                                [initialValue]  = "'<p>Hier die Beschreibung der Standardkonfiguration eingeben...</p>'"
                                                [init]="{
                                                    plugins                     :   'advlist autolink lists link image table code help wordcount ' +
                                                                                    'charmap preview anchor searchreplace visualblocks fullscreen ' +
                                                                                    'insertdatetime media emoticons autosave quickbars visualchars ',
                                                    selector                    :   'textarea',
                                                    onboarding                  :   false,
                                                    toolbar                     :   'undo redo searchreplace | blocks | ' +
                                                                                    'bold italic forecolor | alignleft aligncenter ' +
                                                                                    'alignright alignjustify | bullist numlist outdent indent | ' +
                                                                                    'removeformat | media insertdatetime charmap emoticons anchor | ' +
                                                                                    'preview fullscreen visualchars | help',
                                                    quickbars_selection_toolbar : 'bold italic underline | quicklink',
                                                    quickbars_image_toolbar     : 'alignleft aligncenter alignright | imageoptions',
                                                    quickbars_insert_toolbar    : 'quicktable quickimage quickform',
                                                    height                      :   300,
                                                    base_url                    :   resourceurl,
                                                    suffix                      :   '.min'}"></editor></div></p-accordion-content></p-accordion-panel>

                            <p-accordion-panel value="Globals">
                                <p-accordion-header>Globale Parameter</p-accordion-header>

                                <p-accordion-content>
                                    <ng-container   [ngTemplateOutlet]          = "tplParameter"
                                                    [ngTemplateOutletContext]   = "{
                                                        data    : currentlySelectedFunctionalityData ? currentlySelectedFunctionalityData.Globals ? currentlySelectedFunctionalityData.Globals : [] : [],
                                                        toAdd   : 'Globals'}"></ng-container></p-accordion-content></p-accordion-panel>

                            <p-accordion-panel value="Classes">
                                <p-accordion-header>CSS Klassen</p-accordion-header>

                                <p-accordion-content>
                                    <ng-container   [ngTemplateOutlet]          = "tplParameter"
                                                    [ngTemplateOutletContext]   = "{
                                                        data    : currentlySelectedFunctionalityData ? currentlySelectedFunctionalityData.Classes ? currentlySelectedFunctionalityData.Classes : [] : [],
                                                        toAdd   : 'Classes'}"></ng-container></p-accordion-content></p-accordion-panel>

                            <p-accordion-panel value="Notes">
                                <p-accordion-header>Notizen</p-accordion-header>

                                <p-accordion-content>
                                    <textarea   id = "CodBi_LocalAPIDoc_RightPanel_Notes_Text"

                                                [(ngModel)] = "notes"

                                                placeholder = "Hier können Notizen erfasst werden die ausschließlich über dieses Interface zugänglich sind..."></textarea></p-accordion-content></p-accordion-panel></p-accordion></p-tabpanel></p-tabpanels></p-tabs></ng-template></p-splitter></div>

<div id = "CodBi_LocalAPIDoc_New" #CodBi_LocalAPIDoc_New >
    <div id = "CodBi_LocalAPIDoc_New_Panel">
        <label for = "CodBi_LocalAPIDoc_New_Panel_Name">Geben Sie den Namen {{segment == "detFunctionalities" ? "der neuen Funktionalität" : "des neuen Elementplatzhalters"}} ein</label>
        <input  id      = "CodBi_LocalAPIDoc_New_Name" #CodBi_LocalAPIDoc_New_Name
                type    = "text"

                (keydown) = "onKeyDown_CodBi_LocalAPIDoc_New_Name( $event )"/>

        <button id = "CodBi_LocalAPIDoc_New_Panel_Add" #CodBi_LocalAPIDoc_New_Panel_Add >Hinzufügen</button></div>

    <div class = "-close"><button #CodBi_LocalAPIDoc_New_Panel_Close>X</button></div></div>
<!-- #endregion Templates -->
<ng-template #tplParameter
                let-data    = "data"
                let-toAdd   = "toAdd">
    <p-table    [value] = "data"

                editMode    = "row"
                dataKey     = "id"

                stripedRows >
        <ng-template #header >
            <tr>
                <th style="width:50%">Name</th>
                <th style="width:50%">Kurzbeschreibung</th></tr></ng-template>

                <ng-template   #body

                                let-parameter
                                let-editing = "editing"
                                let-ri      = "rowIndex">
                    <tr [pEditableRow] = "parameter">
                        <td>
                            <p-cellEditor>
                                <ng-template #input >
                                    <input  pInputText

                                            type        = "text"
                                            placeholder = "Hier den Parameternamen eintragen..."
                                            style       = "font-size : 1.5em ; width : 100% ; border-radius: .5em ; border : solid ; border-color: darkorange ; color: darkorange ; box-shadow: 0 0 .5em ;"

                                            [(ngModel)] = "parameter.Name"

                                            required /></ng-template>

                                <ng-template #output>{{ parameter.Name }}</ng-template></p-cellEditor></td>
                                    <td>
                                        <p-cellEditor>
                                            <ng-template #input >
                                                <input  pInputText

                                                        type        = "text"
                                                        placeholder = "Hier die Beschreibung bzw. Kurzbeschreibung eintragen..."
                                                        style       = "font-size : 1.5em ; width : 100% ; border-radius: .5em ; border : solid ; border-color: darkorange ; color: darkorange ; box-shadow: 0 0 .5em ;"

                                                        [(ngModel)] = "parameter.Description"

                                                        required /></ng-template>

                                <ng-template #output >{{ parameter.Description }}</ng-template></p-cellEditor></td>
                                    <td>
                                        <div class="flex items-center justify-center gap-2">
                                            <button *ngIf = "!editing"

                                                    pButton
                                                    pRipple
                                                    pInitEditableRow
                                                    text
                                                    rounded

                                                    type        = "button"
                                                    icon        = "pi pi-pencil"
                                                    severity    = "secondary"

                                                    (click) = "onRowEditInit( parameter )"></button>

                                            <button *ngIf = "!editing"

                                                    pButton
                                                    pRipple
                                                    text
                                                    rounded

                                                    type        = "button"
                                                    icon        = "pi pi-trash"
                                                    severity    = "secondary"

                                                    (click) = "onRowDelete( parameter )"></button>

                                            <button *ngIf = "editing"

                                                    pButton
                                                    pRipple
                                                    text
                                                    rounded
                                                    pSaveEditableRow

                                                    type        = "button"
                                                    severity    = "secondary"
                                                    icon        = "pi pi-check"

                                                    (click) = "onRowEditSave( parameter, ri, toAdd )"></button>

                                            <button *ngIf = "editing"

                                                    pButton
                                                    pRipple
                                                    text
                                                    rounded
                                                    pCancelEditableRow

                                                    icon        = "pi pi-times"
                                                    type        = "button"
                                                    severity    = "secondary"

                                                    (click) = "onRowEditCancel( parameter, ri )"></button></div></td></tr></ng-template></p-table>

    <button id = "CodBi_LocalAPIDoc_RightPanel_AddParameter"

            (click) = "onClick_CodBi_LocalAPIDoc_RightPanel_AddParameter( toAdd )">+</button></ng-template>
<!-- #endregion Templates -->
